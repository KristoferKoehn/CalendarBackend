name: Deploy CalendarBackend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
            $ErrorActionPreference = 'Stop'
            $RepoDir = 'C:\CalendarBackend'

            if (-not (Test-Path (Join-Path $RepoDir '.git'))) {
              Write-Error "Not a git repo: $RepoDir"
              exit 1
            }

            git -C $RepoDir fetch --all --prune
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            git -C $RepoDir pull --ff-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Build backend
        run: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\CalendarBackend'
            go build -o CalendarBackend.exe ./cmd/server

      - name: Run migrations
        run: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\CalendarBackend'
            ./CalendarBackend.exe migrate
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Restart backend service
        run: servy-cli restart --name='CalendarBackend' --quiet | Out-Null
