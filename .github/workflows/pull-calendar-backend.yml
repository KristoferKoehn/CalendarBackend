name: Deploy CalendarBackend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        run: |
            $ErrorActionPreference = 'Stop'
            $RepoDir = 'C:\CalendarBackend'

            if (-not (Test-Path (Join-Path $RepoDir '.git'))) {
              Write-Error "Not a git repo: $RepoDir"
              exit 1
            }

            git -C $RepoDir fetch --all --prune
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            git -C $RepoDir pull --ff-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Run tests
        run: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\CalendarBackend'
            go test ./...

      - name: Run integration tests
        run: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\CalendarBackend'
            go test -tags integration ./...
        env:
            TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Build backend
        run: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\CalendarBackend' 
            go build -o CalendarBackend.exe ./cmd/server

      - name: Seed
        run: |
            $ErrorActionPreference = 'Stop'
            Set-Location 'C:\CalendarBackend'
            ./CalendarBackend.exe seed
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            # NOTE: these apply to this step only. The running service does NOT
            # inherit them — Servy stores a service's environment variables in its
            # own configuration, set at install time with --envVars (or the
            # SERVY_ENVIRONMENT_VARIABLES secret). See backend-handoff.md. They are
            # passed here so the seed sees the same configuration, and so the value
            # is visible in one place.
            MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
            MAIL_FROM: ${{ secrets.MAIL_FROM }}
            MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
            PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
            RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Restart backend service
        run: servy-cli restart --name='CalendarBackend' --quiet | Out-Null
