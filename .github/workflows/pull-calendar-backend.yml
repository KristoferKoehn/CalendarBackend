name: Pull CalendarBackend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pull:
    runs-on: self-hosted
    steps:
      - name: Update CalendarBackend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $RepoDir = Join-Path $env:RUNNER_WORKSPACE 'CalendarBackend'

          if (-not (Test-Path (Join-Path $RepoDir '.git'))) {
            Write-Error "Not a git repo: $RepoDir"
            exit 1
          }

          git -C $RepoDir fetch --all --prune
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git -C $RepoDir pull --ff-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }